# Live and recorded activity.
#
# `kind` is the distinction that matters and is deliberately small:
#   DJ set  — records played
#   Live    — electronic performance
#   A/V     — audiovisual collaboration (the visual half is someone else's work)
#   Stream  — recorded session or mix
#
# An entry only carries a `url` when that destination is genuinely about the
# performance. Linking a venue straight into a project page whose photography is
# from a different night is more confusing than not linking it at all.

upcoming:
