<header class="masthead">
  <div class="field masthead__inner">
    <a class="masthead__name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="nav" aria-label="Main">
      {%- for item in site.data.navigation.main %}
      <a href="{{ item.url | relative_url }}"{% if page.url contains item.url and item.url != '/' %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {%- endfor %}
    </nav>
  </div>
</header>
