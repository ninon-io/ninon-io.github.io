name: Build & deploy

# Deployment safety
# -----------------
# Every branch and pull request is BUILT, so breakage surfaces early.
# Only `master` is DEPLOYED to the live site. A push to a working branch such as
# `phase-2-design-system` can therefore never replace production.
# `workflow_dispatch` allows a deliberate manual deploy, but the deploy job still
# refuses to run unless the ref is `master`.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; queue rather than cancel a live deployment.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true

      - name: Install ffmpeg (waveform peaks)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate waveform peaks
        run: python3 tools/generate-peaks.py

      - name: Build site
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production

      - name: Check internal links and assets
        run: ./tools/check-build.sh _site

      - name: Upload artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # Belt and braces: the job is skipped on any ref other than master.
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
