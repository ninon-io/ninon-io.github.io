<!doctype html>
<html lang="{{ page.lang | default: site.locale | default: 'en' }}">
<head>{% include site/head.html %}</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% include site/masthead.html %}
  <main id="main">{{ content }}</main>
  {% include site/footer.html %}
  {%- if page.has_filter %}<script src="{{ '/assets/js/filter.js' | relative_url }}" defer></script>{% endif %}
  {%- if page.has_player %}<script src="{{ '/assets/js/player.js' | relative_url }}" defer></script>{% endif %}
</body>
</html>
