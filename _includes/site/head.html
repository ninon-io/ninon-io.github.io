<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{%- assign desc = page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 200 -%}
<title>{% if page.title and page.title != '' %}{{ page.title | strip_html }} — {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ desc | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">

<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{% if page.title and page.title != '' %}{{ page.title | strip_html }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{{ desc | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
{%- if page.hero_image %}<meta property="og:image" content="{{ page.hero_image | absolute_url }}">{% endif %}

<link rel="preload" href="/assets/fonts/archivo-variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/newsreader-variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
<link rel="alternate" type="application/atom+xml" href="{{ '/feed.xml' | relative_url }}" title="{{ site.title }}">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": {{ site.social.name | default: site.name | jsonify }},
  "alternateName": {{ site.social.alternate_names | jsonify }},
  "url": {{ '/' | absolute_url | jsonify }},
  "jobTitle": "Audio researcher and electronic musician",
  "sameAs": {{ site.social.links | jsonify }}
}
</script>
